<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #000;
    font-family: "Futura",  sans-serif;
    font-size: 15px;
    overflow: hidden;
  }

  /* Desktop: centered image */
  .center {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .center img { max-width: 60vw; max-height: 80vh; }

  /* Phone */
  .phone {
    position: fixed; right: 4vw; bottom: 0;
    width: 340px; height: min(82vh, 820px);
    box-sizing: border-box;
    padding: 6px 6px 0;
    background: #fff;
    border-radius: 44px 44px 0 0;
    display: flex;
  }
  .screen {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    border: 10px solid #000; border-bottom: 0;
    border-radius: 38px 38px 0 0;
    background: #fff; overflow: hidden;
  }
  .feed {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 28px 18px 8px;
    display: flex; flex-direction: column; gap: 22px;
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }

  /* Post */
  .post { 
    display: block; 
    color: #000; 
    text-decoration: none; 
    flex: none; 
    margin-bottom: 20px;
    }

  .pic {
    position: relative;
    aspect-ratio: 1 / 1;               /* square */
    border: 2px solid #000;
    background: #d9d9d9;
  }
  .pic .post-img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pic .profile {
    position: absolute; left: 8px; top: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .pic .profile img {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: block;
  }
  .cap {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px;
  }
  .heart { width: 16px; height: 16px; fill: none; stroke: #000; stroke-width: 1.5; stroke-linejoin: round; }
  .heart:hover, .liked .heart { fill: #000; }
  .post:focus-visible { outline: 3px solid #ea7f4d; outline-offset: 4px; }

  /* Home button */
  .home {
    flex: none; height: 60px; margin: 0 12px;
    border-top: 3px solid #000;
    display: grid; place-items: center;
  }
  .home img { 
    width: 26px; 
    height: 26px; 
    object-fit: contain; 
    display: block; 
    }

  /* Mobile: only the phone content */
  @media (max-width: 760px) {
    body { background: #fff; }
    .center { display: none; }
    .phone { inset: 0; width: auto; height: auto; padding: 0; border-radius: 0; }
    .screen {
      border: 0; border-radius: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-top: env(safe-area-inset-top, 0px);
    }
    .feed { padding: 20px 0 8px; }
    .home { margin: 0; height: calc(56px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  }
</style>
</head>
<body>

<!-- Desktop center image -->
<div class="center">
  <img src="/in-need-of-connection/elements-2D/menu/doomscroll.png" alt="">
</div>

<main class="phone">
  <div class="screen">
    <nav class="feed">

      <!-- POST start -->
      <a class="post" href="start-6.html">
        <div class="pic">
          <img class="post-img" src="/in-need-of-connection/elements-2D/menu/post-start.png" alt="">
          <div class="profile">
            <img src="/in-need-of-connection/elements-2D/menu/Profile-pic-mainshrimp.png" alt="">
            <span>Shrimp</span>
          </div>
        </div>
        <div class="cap">
          <span><b>Chapter 0:</b> The start</span>
          <svg class="heart" viewBox="0 0 16 16"><path d="M8 14.5 1.6 8A4 4 0 0 1 8 3a4 4 0 0 1 6.4 5z"/></svg>
        </div>
      </a>

      <!-- POST story 1 -->
      <a class="post" href="story-1-4.html">
        <div class="pic">
          <img class="post-img" src="/in-need-of-connection/elements-2D/menu/post-story1.png" alt="">
          <div class="profile">
            <img src="/in-need-of-connection/elements-2D/menu/Profile-pic-mainshrimp.png" alt="">
            <span>Shrimp</span>
          </div>
        </div>
        <div class="cap">
          <span><b>Chapter 1:</b> The swarm</span>
          <svg class="heart" viewBox="0 0 16 16"><path d="M8 14.5 1.6 8A4 4 0 0 1 8 3a4 4 0 0 1 6.4 5z"/></svg>
        </div>
      </a>

     <!-- POST story 2 -->
      <a class="post" href="story-2-2.html">
        <div class="pic">
          <img class="post-img" src="/in-need-of-connection/elements-2D/menu/post-story2.png" alt="">
          <div class="profile">
            <img src="/in-need-of-connection/elements-2D/menu/Profile-pic-mainshrimp.png" alt="">
            <span>Shrimp</span>
          </div>
        </div>
        <div class="cap">
          <span><b>Chapter 1:</b> The lunchtime breakthrough</span>
          <svg class="heart" viewBox="0 0 16 16"><path d="M8 14.5 1.6 8A4 4 0 0 1 8 3a4 4 0 0 1 6.4 5z"/></svg>
        </div>
      </a>

        <!-- POST story 3 -->
      <a class="post" href="story-3-4.html">
        <div class="pic">
          <img class="post-img" src="/in-need-of-connection/elements-2D/menu/post-story3.png" alt="">
          <div class="profile">
            <img src="/in-need-of-connection/elements-2D/menu/Profile-pic-mainshrimp.png" alt="">
            <span>Shrimp</span>
          </div>
        </div>
        <div class="cap">
          <span><b>Chapter 1:</b> The meeting point</span>
          <svg class="heart" viewBox="0 0 16 16"><path d="M8 14.5 1.6 8A4 4 0 0 1 8 3a4 4 0 0 1 6.4 5z"/></svg>
        </div>
      </a>

    </nav>
    <div class="home"><img src="/in-need-of-connection/elements-2D/menu/home-shell.png" alt="Home"></div>
  </div>
</main>

</body>
</html>
