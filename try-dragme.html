<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlapping Draggable Circles</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      touch-action: none;
      user-select: none;
    }

    .circle {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .top {
      /* Top-right anchor */
      top: 28px;
      right: 28px;
      background: rgba(55, 140, 255, 1);
      z-index: 2;
    }

    .bottom {
      /*
        The centers are initially separated by about 1.26 radii,
        which makes the intersection about 80% of each circle's area.
      */
      top: 117px;
      right: 98px;
      background: rgba(255, 92, 92, 1);
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }

    .bottom:active { cursor: grabbing; }

    .hint {
      position: absolute;
      left: 20px;
      bottom: 20px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.88);
      color: #333;
      font-size: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .circle { width: 120px; height: 120px; }
      .top { top: 20px; right: 20px; }
      .bottom { top: 96px; right: 80px; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive overlapping circles">
    <div class="circle top" aria-hidden="true"></div>
    <div
      class="circle bottom"
      id="draggable"
      role="img"
      aria-label="Draggable red circle"
      tabindex="0"
    ></div>
    <div class="hint">Drag the red circle anywhere.</div>
  </main>

  <script>
    (() => {
      const stage = document.getElementById("stage");
      const circle = document.getElementById("draggable");

      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      circle.addEventListener("pointerdown", (event) => {
        dragging = true;
        circle.setPointerCapture(event.pointerId);

        const rect = circle.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        circle.style.cursor = "grabbing";
      });

      circle.addEventListener("pointermove", (event) => {
        if (!dragging) return;

        const stageRect = stage.getBoundingClientRect();
        const circleSize = circle.offsetWidth;

        let x = event.clientX - stageRect.left - offsetX;
        let y = event.clientY - stageRect.top - offsetY;

        x = clamp(x, 0, stageRect.width - circleSize);
        y = clamp(y, 0, stageRect.height - circleSize);

        circle.style.left = `${x}px`;
        circle.style.top = `${y}px`;
        circle.style.right = "auto";
      });

      function stopDragging(event) {
        if (!dragging) return;
        dragging = false;
        circle.style.cursor = "grab";
        if (event.pointerId !== undefined && circle.hasPointerCapture(event.pointerId)) {
          circle.releasePointerCapture(event.pointerId);
        }
      }

      circle.addEventListener("pointerup", stopDragging);
      circle.addEventListener("pointercancel", stopDragging);
    })();
  </script>
</body>
</html>
