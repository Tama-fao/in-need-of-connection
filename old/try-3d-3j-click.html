<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Fish Model</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #dff1f7;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
    position: relative;
  }

  canvas {
    display: block;
  }

  #info-box {
    position: absolute;
    display: none;
    background: white;
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 240px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    pointer-events: none;
    z-index: 10;
    transform: translate(0, -100%);
  }

  #info-box strong {
    display: block;
    font-size: 15px;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  #info-box p {
    margin: 0;
    font-size: 13px;
    line-height: 1.4;
    color: #444;
  }

  #hint {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    pointer-events: none;
    z-index: 10;
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: #555;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <div id="loading">Loading model…</div>
  <div id="info-box">
    <strong id="info-title"></strong>
    <p id="info-text"></p>
  </div>
  <div id="hint">Drag to rotate · Scroll to zoom · Click a part for info</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
 

  // ---------- CONFIG: info shown per mesh name ----------
  // Edit the title/text for each part below. Keys must match your mesh names exactly.
  const partInfo = {
    "eye-rims":    { title: "Eye Rims",    text: "The rim detailing around the fish's eyes." },
    "eyes":        { title: "Eyes",        text: "The fish's eyes." },
    "fins":        { title: "Fins",        text: "The fins used for steering and propulsion." },
    "fish-body":   { title: "Body",        text: "The main body of the fish." },
    "sphere-blue":   { title: "Blue Sphere",   text: "A blue accent sphere." },
    "sphere-green":  { title: "Green Sphere",  text: "A green accent sphere." },
    "sphere-lilac":  { title: "Lilac Sphere",  text: "A lilac accent sphere." },
    "sphere-white":  { title: "White Sphere",  text: "A white accent sphere." }
  };

  const MODEL_PATH = "models/try-fish-apply.glb";
  // -------------------------------------------------------

  const container = document.getElementById('canvas-container');
  const infoBox = document.getElementById('info-box');
  const infoTitle = document.getElementById('info-title');
  const infoText = document.getElementById('info-text');
  const loadingEl = document.getElementById('loading');

  // Scene setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdff1f7);

  const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
  );
  camera.position.set(2.5, 1.8, 3.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Controls
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 1;
  controls.maxDistance = 15;

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 8, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
  fillLight.position.set(-5, 2, -5);
  scene.add(fillLight);

  // Post-processing: render pass -> outline -> output
const w = container.clientWidth, h = container.clientHeight;
const composer = new EffectComposer(
  renderer,
  new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 }) // keeps antialiasing
);
composer.addPass(new RenderPass(scene, camera));

const outlinePass = new OutlinePass(new THREE.Vector2(w, h), scene, camera);
outlinePass.edgeStrength = 5;
outlinePass.edgeThickness = 2;
outlinePass.edgeGlow = 0;
outlinePass.pulsePeriod = 0;
outlinePass.visibleEdgeColor.set(0xffb800);
outlinePass.hiddenEdgeColor.set(0xffb800);
composer.addPass(outlinePass);

composer.addPass(new OutputPass());

  // Ground (optional, purely visual)
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.ShadowMaterial({ opacity: 0.15 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1;
  ground.receiveShadow = true;
  scene.add(ground);

  // Track meshes we care about, and remember original materials for hover highlight
  let modelRoot = null;
  const originalMaterials = new Map();
  let hoveredMesh = null;



  // Load model
  const loader = new GLTFLoader();
  loader.load(
    MODEL_PATH,
    (gltf) => {
      modelRoot = gltf.scene;

      modelRoot.traverse((child) => {
  if (child.isMesh) {
    // child.geometry.computeVertexNormals(); ← remove/comment this out
    child.castShadow = true;
    child.receiveShadow = true;
    originalMaterials.set(child, child.material);
  }
});

      // Center and scale the model to fit the view
      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      modelRoot.position.x -= center.x;
      modelRoot.position.y -= center.y;
      modelRoot.position.z -= center.z;

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = maxDim > 0 ? 2 / maxDim : 1;
      modelRoot.scale.setScalar(scale);

      ground.position.y = (box.min.y - center.y) * scale - 0.01;

      scene.add(modelRoot);
      loadingEl.style.display = 'none';
    },
    (xhr) => {
      if (xhr.total) {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        loadingEl.textContent = `Loading model… ${pct}%`;
      }
    },
    (error) => {
      console.error('Error loading model:', error);
      loadingEl.textContent = 'Failed to load model. Check the path/console.';
    }
  );

  // ---------- Raycasting: click & hover ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function getIntersect(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    if (!modelRoot) return null;

    const intersects = raycaster.intersectObjects(modelRoot.children, true);
    return intersects.length > 0 ? intersects[0] : null;
  }

  function clearHighlight() {
  hoveredMesh = null;
  outlinePass.selectedObjects = [];
}

renderer.domElement.addEventListener('mousemove', (event) => {
  const hit = getIntersect(event);

  if (hit && partInfo[hit.object.name]) {
    if (hoveredMesh !== hit.object) {
      hoveredMesh = hit.object;
      outlinePass.selectedObjects = [hoveredMesh];
    }
    renderer.domElement.style.cursor = 'pointer';
  } else {
    clearHighlight();
    renderer.domElement.style.cursor = 'default';
  }
});

  renderer.domElement.addEventListener('click', (event) => {
    const hit = getIntersect(event);

    if (hit && partInfo[hit.object.name]) {
      const info = partInfo[hit.object.name];
      infoTitle.textContent = info.title;
      infoText.textContent = info.text;

      infoBox.style.left = event.clientX + 'px';
      infoBox.style.top = event.clientY + 'px';
      infoBox.style.display = 'block';
    } else {
      infoBox.style.display = 'none';
    }
  });

  // Hide info box if clicking outside the canvas
  document.addEventListener('click', (event) => {
    if (!container.contains(event.target)) {
      infoBox.style.display = 'none';
    }
  });

  // ---------- Resize handling ----------
  window.addEventListener('resize', () => {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  composer.render();   // was renderer.render(scene, camera)
}

  // ---------- Render loop ----------
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();


 



</script>

</body>
</html>
