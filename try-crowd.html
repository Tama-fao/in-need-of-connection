<!DOCTYPE html>
<html>
<head>
</head>
<body>
  
    <div class="container">
      <div class="message" id="message">that is okey</div>
    
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot red"></div>
        <div class="dot red"></div>
        <div class="dot red"></div>
    
        <div class="dot blue"></div>
    
        <div class="dot red"></div>
        <div class="dot red"></div>
        <div class="dot red"></div>
        <div class="dot red"></div>
      </div>
    </div>
    
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    
      .container {
        width: 100%;
        height: 100vh;
    
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
    
      .message {
        text-align: center;
        margin-bottom: 20px;
        font-size: 24px;
      }
    
      .dots {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        align-items: center;
      }
    
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        justify-self: center;
      }
    
      .red {
        background: red;
      }
    
      .blue {
        background: blue;
      }
    
      /* Below 800px */
      @media (max-width: 799px) {
        .message::after {
          content: "to close";
        }
    
        .message {
          font-size: 0;
        }
    
        .message::after {
          font-size: 24px;
        }
      }
    
      /* 800px - 1200px */
      @media (min-width: 800px) and (max-width: 1200px) {
        .message::after {
          content: "that is okey";
        }
    
        .message {
          font-size: 0;
        }
    
        .message::after {
          font-size: 24px;
        }
      }
    
      /* Above 1200px */
      @media (min-width: 1201px) {
        .message::after {
          content: "to far";
        }
    
        .message {
          font-size: 0;
        }
    
        .message::after {
          font-size: 24px;
        }
      }
    </style>

    
    </body>
</html>
